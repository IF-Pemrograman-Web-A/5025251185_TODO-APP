
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo App</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header class="header">
        <div class="header-content">
            <h1>TODO LIST</h1>
            <p class="subtitle">
            </p>
        </div>
    </header>


    <!-- ================= MAIN CONTENT ================= -->
    <main class="main-container">

        <!-- ========== PANEL KIRI ========== -->
        <section class="todo-panel">

            <div class="panel-header">
                <h2>Daftar Tugas</h2>

                <span class="todo-count">
                    3 Tasks
                </span>
            </div>


            <div class="todo-list">

                <!-- TODO 1 -->
                <article class="todo-card active">
                    <div class="todo-info">
                        <h3>PBO</h3>

                        <p>
                            Tugas Pemrogaman
                        </p>
                    </div>
                </article>


                <article class="todo-card">
                    <div class="todo-info">
                        <h3>Matdis 2</h3>

                        <p>
                            Tugas Harian 2
                        </p>
                    </div>
                </article>


                <article class="todo-card">
                    <div class="todo-info">
                        <h3>KKA</h3>

                        <p>
                            Perancangan AI
                        </p>
                    </div>
                </article>

            </div>

        </section>


        <!-- ========== PANEL KANAN ========== -->
        <aside class="editor-panel">



            <!-- ========== FORM TODO BARU ========== -->
            <div class="form-section">

                <h2>Tambah Tugas Baru</h2>

                <form class="todo-form">

                    <div class="form-group">
                        <label for="title">
                            Nama Matkul
                        </label>

                        <input
                            type="text"
                            id="title"
                            name="title"
                            placeholder="Masukkan nama matkul"
                        >
                    </div>


                    <div class="form-group">
                        <label for="description">
                            Deskripsi
                        </label>

                        <textarea
                            id="description"
                            name="description"
                            placeholder="Masukkan deskripsi tugas"
                            rows="4"
                        ></textarea>
                    </div>



                    <button type="submit" class="btn-submit">
                        Tambah Tugas
                    </button>

                </form>

            </div>

        </aside>

    </main>


    <!-- ================= FOOTER ================= -->
    <footer class="footer">

        <p>
            &copy; 2026 Todo App 
        </p>

        <p>
            Teknik Informatika | ITS
        </p>

    </footer>

</body>
</html>
